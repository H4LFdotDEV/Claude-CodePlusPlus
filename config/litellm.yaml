# LiteLLM Proxy Configuration
# Claude Code++
# Jeremiah Kroesche | Halfservers LLC
#
# Configuration for model routing, cost optimization, and guardrails

model_list:
  # Anthropic Models
  - model_name: claude-3-opus
    litellm_params:
      model: claude-3-opus-20240229
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      max_tokens: 4096
      max_input_tokens: 200000
      input_cost_per_token: 0.000015
      output_cost_per_token: 0.000075
      
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      max_tokens: 8192
      max_input_tokens: 200000
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

  - model_name: claude-3-5-haiku
    litellm_params:
      model: claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      max_tokens: 8192
      max_input_tokens: 200000
      input_cost_per_token: 0.0000008
      output_cost_per_token: 0.000004

  # OpenAI Models (optional)
  - model_name: gpt-4o
    litellm_params:
      model: gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      max_tokens: 4096
      max_input_tokens: 128000
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000015

  - model_name: gpt-4o-mini
    litellm_params:
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      max_tokens: 16384
      max_input_tokens: 128000
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006

  # Local Models (via Ollama)
  - model_name: local/gemma
    litellm_params:
      model: ollama/gemma:2b
      api_base: http://host.docker.internal:11434
    model_info:
      max_tokens: 8192
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: local/phi
    litellm_params:
      model: ollama/phi3:mini
      api_base: http://host.docker.internal:11434
    model_info:
      max_tokens: 4096
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: local/llama
    litellm_params:
      model: ollama/llama3:8b
      api_base: http://host.docker.internal:11434
    model_info:
      max_tokens: 8192
      input_cost_per_token: 0
      output_cost_per_token: 0

# Router settings
router_settings:
  routing_strategy: "simple-shuffle"  # Options: simple-shuffle, least-busy, usage-based-routing
  
  # Fallback chain
  fallbacks:
    - claude-3-5-sonnet: ["claude-3-opus", "gpt-4o"]
    - claude-3-5-haiku: ["gpt-4o-mini", "local/gemma"]
    - local/gemma: ["local/phi", "claude-3-5-haiku"]

  # Context window fallbacks (automatic model upgrade for long contexts)
  context_window_fallbacks:
    - gpt-4o-mini: ["gpt-4o", "claude-3-5-sonnet"]

# General settings
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  
  # Caching
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379

  # Logging
  success_callback: ["langfuse"]  # Optional: for detailed logging
  
  # Cost tracking
  max_budget: 50.0  # Daily budget in USD
  budget_duration: "1d"

# Guardrails
guardrails:
  # Content moderation
  - guardrail_name: "content-filter"
    litellm_params:
      guardrail: "presidio"
      mode: "mask"  # mask | block
      
  # PII detection
  - guardrail_name: "pii-filter"
    litellm_params:
      guardrail: "presidio"
      analyze:
        - "PERSON"
        - "EMAIL_ADDRESS"
        - "PHONE_NUMBER"
        - "CREDIT_CARD"

# Rate limits
litellm_settings:
  # Per-user limits
  max_user_budget: 10.0  # Per user per day
  
  # Request limits
  max_parallel_requests: 10
  request_timeout: 120
  
  # Retry settings
  num_retries: 3
  retry_after: 5

# Alerting (optional)
alerting:
  - alerting_type: "slack"
    alerting_args:
      webhook_url: os.environ/SLACK_WEBHOOK_URL
    alert_types:
      - "llm_exceptions"
      - "budget_alerts"
      - "spend_reports"
