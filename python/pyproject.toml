[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-mcp"
version = "1.0.0"
description = "Memory MCP Server for Claude Code++ - Tiered memory system with Redis, FAISS, SQLite, and Obsidian vault"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jeremiah Kroesche", email = "jeremiah@halfservers.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
redis = ["redis>=4.0"]
faiss = ["faiss-cpu>=1.7"]
embeddings = ["httpx>=0.24"]
all = [
    "redis>=4.0",
    "faiss-cpu>=1.7",
    "httpx>=0.24",
    "numpy>=1.24",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
]

[project.scripts]
memory-mcp = "memory_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jeremiah/claude-code-pp"
Documentation = "https://github.com/jeremiah/claude-code-pp#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["memory_mcp*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
