# Docker Compose Stack for Claude Code++
# Jeremiah Kroesche | Halfservers LLC
#
# This provides the containerized infrastructure for Claude Code++
# Enterprise-grade deployment with resource limits, health checks, and logging

services:
  # Knowledge graph for memory (warm layer) - Graphiti/Neo4j
  neo4j:
    image: neo4j@sha256:d75b69079f6d1253d03286552bd2202c1a9216d40cba159b532af71f74613e67  # 5.26-community
    container_name: claude-code-pp-neo4j
    ports:
      - "127.0.0.1:7474:7474"  # HTTP browser
      - "127.0.0.1:7687:7687"  # Bolt protocol
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    environment:
      # Auth format: username/password
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD required}
      # APOC plugin for advanced procedures (restricted to required procedures only)
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_allowlist=apoc.text.*,apoc.coll.*,apoc.meta.*
      # Memory configuration
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=256m
      # Performance tuning
      - NEO4J_server_threads_worker__count=4
      - NEO4J_db_transaction_timeout=60s
    networks:
      - data         # Data tier (primary)
      - application  # Accessible from app tier
      - claude-code-pp  # Legacy compatibility
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Code search engine (cold layer) - livegrep backend
  livegrep-backend:
    # NOTE: GHCR image requires authentication to pull digest. Verify manually with:
    # docker pull ghcr.io/livegrep/livegrep:v2.0.0 && docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/livegrep/livegrep:v2.0.0
    image: ghcr.io/livegrep/livegrep:v2.0.0  # Unable to pin: GHCR access denied without auth
    container_name: claude-code-pp-livegrep-backend
    command: codesearch -load_index /data/index.idx -grpc 0.0.0.0:9999
    ports:
      - "127.0.0.1:9999:9999"
    volumes:
      - livegrep-data:/data
    networks:
      - application  # App tier (search engine)
      - claude-code-pp  # Legacy compatibility
    profiles:
      - livegrep
    restart: unless-stopped
    healthcheck:
      # gRPC health check - attempt connection to the backend
      test: ["CMD-SHELL", "nc -z localhost 9999 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Code search frontend (cold layer) - livegrep web
  livegrep-frontend:
    # NOTE: GHCR image requires authentication to pull digest. Verify manually with:
    # docker pull ghcr.io/livegrep/livegrep:v2.0.0 && docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/livegrep/livegrep:v2.0.0
    image: ghcr.io/livegrep/livegrep:v2.0.0  # Unable to pin: GHCR access denied without auth
    container_name: claude-code-pp-livegrep-frontend
    command: livegrep -listen 0.0.0.0:8910 -backends livegrep-backend:9999
    ports:
      - "127.0.0.1:8910:8910"
    depends_on:
      livegrep-backend:
        condition: service_healthy
    networks:
      - frontend     # External-facing web UI
      - application  # Connect to backend
      - claude-code-pp  # Legacy compatibility
    profiles:
      - livegrep
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8910/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Vector store for memory (warm layer) - Legacy, use neo4j instead
  chromadb:
    image: chromadb/chroma@sha256:5c52289301c2f55b5d889edd16966f7349cb7b0e60619597f11e135ee406fec2  # 0.4.22
    container_name: claude-code-pp-chroma
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - data  # Data tier only
      - claude-code-pp  # Legacy compatibility
    profiles:
      - legacy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Fast cache and session memory (hot layer)
  redis:
    image: redis@sha256:65748f2ea686cb0e37a008cbe7024324db1d84abf57e917e1c2ec92b5e50f602  # 7.2-alpine
    container_name: claude-code-pp-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    networks:
      - data         # Data tier (primary)
      - application  # Accessible from app tier
      - claude-code-pp  # Legacy compatibility
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Browser automation (optional)
  playwright:
    image: mcr.microsoft.com/playwright@sha256:aaf7bf71469e471d6c4207ae3280d664be37c1a5472533b7ee74ee4741742044  # v1.45.0-focal
    container_name: claude-code-pp-playwright
    ports:
      - "127.0.0.1:9222:9222"
    shm_size: 2gb
    networks:
      - frontend  # Frontend tier only (isolated from data)
      - claude-code-pp  # Legacy compatibility
    profiles:
      - browser
    restart: unless-stopped

  # Local LLM server via Ollama (optional)
  ollama:
    image: ollama/ollama@sha256:6f2f92bd0f3b2785f1d211552fd20de78b5a5b88eea2ba131e1ec2cd2bf36a33  # 0.1.33
    container_name: claude-code-pp-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - application  # App tier (LLM service)
      - claude-code-pp  # Legacy compatibility
    profiles:
      - local-llm
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Test runner container (optional)
  test-runner:
    build:
      context: ./containers/test-runner
      dockerfile: Dockerfile
    container_name: claude-code-pp-test-runner
    volumes:
      - ${HOME}/projects:/projects:ro
      - test-results:/results
    networks:
      - application  # App tier (test infrastructure)
      - claude-code-pp  # Legacy compatibility
    profiles:
      - testing
    restart: "no"

  # CI/CD simulation with Act (optional)
  act:
    # NOTE: GHCR image requires authentication to pull digest. Verify manually with:
    # docker pull ghcr.io/nektos/act:v0.2.62 && docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/nektos/act:v0.2.62
    image: ghcr.io/nektos/act:v0.2.62  # Unable to pin: GHCR access denied without auth
    container_name: claude-code-pp-act
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/projects:/projects
    networks:
      - application  # App tier (CI/CD infrastructure)
      - claude-code-pp  # Legacy compatibility
    profiles:
      - cicd
    restart: "no"

  # Memory MCP server (containerized)
  memory-mcp:
    build:
      context: ..
      dockerfile: docker/memory-mcp/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: claude-code-pp-memory-mcp
    profiles:
      - mcp-container
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - SQLITE_PATH=/data/sqlite/memories.db
      - OBSIDIAN_VAULT_PATH=/data/vault
    volumes:
      - memory-sqlite:/data/sqlite
      - ${OBSIDIAN_VAULT_PATH:-~/.claude-code-pp/memory/vault}:/data/vault
      - ~/.claude-code-pp/mounts:/mounts:ro
      - /var/run/claude-broker.sock:/var/run/claude-broker.sock:ro
    networks:
      - application  # App tier (primary)
      - data         # Access to data tier
      - claude-code-pp  # Legacy compatibility
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: unless-stopped

  # OpenClaw multi-channel AI gateway
  openclaw:
    build:
      context: ../openclaw
      dockerfile: Dockerfile
    container_name: claude-code-pp-openclaw
    profiles:
      - openclaw
    ports:
      - "127.0.0.1:18789:18789"  # Gateway API
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Memory MCP Bridge configuration
      - OPENCLAW_PLUGIN_MEMORY_MCP_ENABLED=true
      - OPENCLAW_PLUGIN_MEMORY_MCP_COMMAND=/app/memory-mcp
    volumes:
      - openclaw-config:/data/config
      - openclaw-sessions:/data/sessions
      # Share Memory MCP binary with container
      - ${HOME}/.claude-code-pp/bin:/app:ro
    networks:
      - frontend     # External-facing API
      - application  # App tier
      - data         # Access to data tier
      - claude-code-pp  # Legacy compatibility
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18789/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # OpenClaw sandbox browser (for browser automation features)
  openclaw-sandbox-browser:
    build:
      context: ../openclaw
      dockerfile: Dockerfile.sandbox-browser
    container_name: claude-code-pp-openclaw-browser
    profiles:
      - openclaw
      - openclaw-browser
    ports:
      - "127.0.0.1:9223:9222"  # CDP (9223 to avoid conflict with Playwright's 9222)
      - "127.0.0.1:5900:5900"  # VNC
      - "127.0.0.1:6080:6080"  # noVNC web
    shm_size: 2gb
    networks:
      - frontend  # Frontend tier only (browser automation isolated)
      - claude-code-pp  # Legacy compatibility
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  neo4j-data:
    name: claude-code-pp-neo4j-data
  neo4j-logs:
    name: claude-code-pp-neo4j-logs
  livegrep-data:
    name: claude-code-pp-livegrep-data
  chroma-data:
    name: claude-code-pp-chroma-data
  redis-data:
    name: claude-code-pp-redis-data
  ollama-data:
    name: claude-code-pp-ollama-data
  test-results:
    name: claude-code-pp-test-results
  memory-sqlite:
    name: claude-code-pp-memory-sqlite
  openclaw-config:
    name: claude-code-pp-openclaw-config
  openclaw-sessions:
    name: claude-code-pp-openclaw-sessions

# Network Segmentation (Optimization #8)
# Three-tier network architecture for defense in depth:
# - frontend: External-facing services (browser automation, web UIs)
# - application: Application logic (MCP servers, gateways)
# - data: Database tier (Redis, Neo4j) - internal only
networks:
  frontend:
    driver: bridge
    name: claude-code-pp-frontend
  application:
    driver: bridge
    name: claude-code-pp-application
    internal: true  # No external access
  data:
    driver: bridge
    name: claude-code-pp-data
    internal: true  # No external access
  # Legacy network for backwards compatibility
  claude-code-pp:
    driver: bridge

# Usage:
#
# Start core services (Redis + Neo4j):
#   docker-compose up -d
#
# Start with code search (livegrep):
#   docker-compose --profile livegrep up -d
#
# Start with browser automation:
#   docker-compose --profile browser up -d
#
# Start with local LLM:
#   docker-compose --profile local-llm up -d
#
# Start with containerized Memory MCP:
#   docker-compose --profile mcp-container up -d
#
# Start with OpenClaw multi-channel gateway:
#   docker-compose --profile openclaw up -d
#
# Start everything:
#   docker-compose --profile livegrep --profile browser --profile local-llm --profile testing --profile cicd --profile mcp-container --profile openclaw up -d
#
# Stop all:
#   docker-compose down
#
# View logs:
#   docker-compose logs -f
#
# Access Neo4j Browser:
#   http://localhost:7474 (user: neo4j, password: $NEO4J_PASSWORD)
#
# Access livegrep search:
#   http://localhost:8910
#
# Index code for livegrep (requires indexing first):
#   docker exec claude-code-pp-livegrep-backend codesearch -index_only -dump_index /data/index.idx /data/config.json
#
# Pull Ollama models (after starting ollama service):
#   docker exec claude-code-pp-ollama ollama pull nomic-embed-text
#   docker exec claude-code-pp-ollama ollama pull gemma:2b
